<!doctype html><html lang="zh-CN" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSH remote workspaces — demo</title><style>
:root{color-scheme:light;--dsh-frame-top-clearance:24px}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}html.dark{color-scheme:dark}#app{display:flex;height:100vh}aside{width:230px;flex-shrink:0;padding:34px 18px;background:color-mix(in srgb,CanvasText 5%,Canvas);border-right:1px solid #8883}aside strong{display:block;font-size:18px;margin:6px 8px 34px}aside small{display:block;font-size:10px;letter-spacing:2px;opacity:.5;margin-top:8px}aside .entry{padding:13px 12px;font-size:14px;display:flex;gap:9px;align-items:center;border-radius:9px;background:#6d8ec51f}aside p{font-size:12px;opacity:.45;margin:28px 10px 12px}aside .workspace{font-size:13px;margin-left:10px}main{flex:1;min-width:0}#root{height:100%}@media(max-width:700px){aside{display:none}}
</style></head><body><div id="app"><aside><strong>DeepSeek Harness<small>REMOTE WORKSPACES</small></strong><div id="sidebar"></div><p>工作区</p><div class="workspace">▱ &nbsp; 示例项目 · SSH dev.example.com</div></aside><main><div id="root"></div></main></div>
<script src="../../node_modules/react/umd/react.development.js"></script><script src="../../node_modules/react-dom/umd/react-dom.development.js"></script>
<script>window.__ModuleLoader__={load(bundle){window.sshBundle=bundle}};</script><script src="../../ui/client.js"></script><script>
// Fictional fixtures only: this preview never reads SSH configuration or connects.
const plugin=window.sshBundle.factory(name=>({react:React})[name]);
window.calls=[];window.failConnect=false;window.delayConnect=false;window.noHosts=false;
window.workspaceListeners=new Set();window.archivedSessionIds=[];
window.mounts=[{name:'示例项目',hostname:'dev.example.com',alias:'dev-server',remoteDir:'/home/demo/projects/sample-project',localDir:'/demo/workspaces/sample-project',status:'saved',checkedAt:null,message:''}];
window.hosts=[{alias:'dev-server',hostname:'dev.example.com'},{alias:'staging',hostname:'staging.example.com'}];
const folders={'/':['home','srv'],'/home':['demo'],'/home/demo':['.config','Documents','projects'],'/home/demo/projects':['api-service','sample-project','website'],'/home/demo/projects/sample-project':['docs','src','tests']};
function delay(ms,signal){return new Promise((resolve,reject)=>{if(signal?.aborted)return reject(signal.reason);const id=setTimeout(resolve,ms);signal?.addEventListener('abort',()=>{clearTimeout(id);reject(signal.reason)},{once:true})})}
const ctx={
 connection:{rpc:{async call(base,endpoint,payload,signal){
  const method=endpoint.split('/')[1],request=payload.args.request;window.calls.push({method,request});
  if(method==='list')return {ok:true,value:{hosts:window.noHosts?[]:window.hosts,mounts:window.mounts,warnings:[]}};
  if(method==='browse'){
   await delay(window.slowBrowse?1500:60,signal);
   if(window.failBrowse)return {ok:false,error:{message:'Permission denied (publickey)'}};
   const path=request.path||'/home/demo';
   if(path==='/missing'||window.missingBrowse)return {ok:false,error:{message:'目录不存在或已被移走，请返回上级目录。'}};
   return {ok:true,value:{path,parent:path==='/'?null:path.slice(0,path.lastIndexOf('/'))||'/',truncated:false,directories:(folders[path]||[]).filter(n=>request.show_hidden||!n.startsWith('.')).map(name=>({name,path:(path==='/'?'':path)+'/'+name,hidden:name.startsWith('.')}))}};
  }
  if(method==='connect'){
   if(window.delayConnect)await delay(350,signal);
   if(window.failConnect)return {ok:false,error:{message:'Permission denied (publickey)'}};
   const value={name:request.name||request.remote_path.split('/').pop(),hostname:window.hosts.find(h=>h.alias===request.host).hostname,alias:request.host,remoteDir:request.remote_path,localDir:'/demo/workspaces/connected',status:'connected',checkedAt:new Date().toISOString(),message:''};window.mounts=[value];return {ok:true,value};
  }
  if(method==='open'){document.querySelector('aside .workspace').textContent=window.mounts[0].name+' · SSH '+window.mounts[0].hostname;return {ok:true,value:{workspaceId:'demo-workspace'}};}
  if(method==='check'){window.mounts[0].status='connected';window.mounts[0].checkedAt=new Date().toISOString();return {ok:true,value:window.mounts[0]};}
  if(method==='disconnect'){window.mounts=[];return {ok:true,value:{closed:true}};}
  if(method==='remove'){
   if(window.failRemove)return {ok:false,error:{message:'工作区中仍有任务在运行，请先结束任务，再移除工作区。'}};
   window.mounts=[];window.archivedSessionIds=['demo-chat'];window.workspaceListeners.forEach(listener=>listener());
   return {ok:true,value:{removed:true,localDir:request.local_path,archivedSessionIds:window.archivedSessionIds}};
  }
 }}},
 workspaces:{list:{subscribe(listener){window.workspaceListeners.add(listener);return ()=>window.workspaceListeners.delete(listener)}}},
 uiWorkspace:{async openWorkspace(id){window.calls.push({method:'open-workspace',id})}},
 slots:{inject(name,fn){return fn()},register(spec,Component){if(spec.name==='main')window.panel={spec,Component};else window.sidebarEntry={spec,Component};return ()=>{}}},
};
plugin.apply(ctx);
ReactDOM.createRoot(document.getElementById('sidebar')).render(React.createElement('div',{className:'entry'},React.createElement(window.sidebarEntry.Component),window.sidebarEntry.spec.label));
window.previewRoot=ReactDOM.createRoot(document.getElementById('root'));
window.previewRoot.render(React.createElement(window.panel.Component,{...window.panel.spec.inject()}));window.ready=true;
</script></body></html>
